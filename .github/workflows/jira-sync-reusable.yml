name: JIRA Sync (Reusable)

on:
  workflow_call:
    inputs:
      spec-only-path-pattern:
        required: true
        type: string
    secrets:
      jira-base-url:
        required: false
      jira-email:
        required: false
      jira-api-token:
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  jira-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List changed files (merge only)
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        id: changed-files
        run: |
          FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          {
            echo "files<<JIRA_SYNC_EOF"
            echo "$FILES"
            echo "JIRA_SYNC_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run jira-sync
        uses: dnode-ryosuke-yamazaki/study/.github/actions/jira-sync@main
        with:
          jira-base-url: ${{ secrets.jira-base-url }}
          jira-email: ${{ secrets.jira-email }}
          jira-api-token: ${{ secrets.jira-api-token }}
          changed-files: ${{ steps.changed-files.outputs.files }}
          spec-only-path-pattern: ${{ inputs.spec-only-path-pattern }}