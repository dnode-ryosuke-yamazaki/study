name: JIRA Sync (Reusable)

on:
  workflow_call:
    inputs:
      spec-only-path-pattern:
        required: true
        type: string
    secrets:
      jira-base-url:
        required: false
      jira-email:
        required: false
      jira-api-token:
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  jira-sync:
    runs-on: ubuntu-latest
    steps:
      # 変更ファイル一覧はGitHub APIから取得する。git diffを使わないのは、
      # squashマージ+ブランチ削除の後はPRのhead commitがどのrefからも到達できず、
      # checkout(fetch-depth: 0)でも手元に来ないためgit diffが失敗する(exit code 128)。
      # PRのfilesエンドポイントはマージ後も参照できる。
      - name: List changed files (merge only)
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        id: changed-files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          {
            echo "files<<JIRA_SYNC_EOF"
            echo "$FILES"
            echo "JIRA_SYNC_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run jira-sync
        uses: dnode-ryosuke-yamazaki/study/.github/actions/jira-sync@main
        with:
          jira-base-url: ${{ secrets.jira-base-url }}
          jira-email: ${{ secrets.jira-email }}
          jira-api-token: ${{ secrets.jira-api-token }}
          changed-files: ${{ steps.changed-files.outputs.files }}
          spec-only-path-pattern: ${{ inputs.spec-only-path-pattern }}