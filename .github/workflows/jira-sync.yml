name: JIRA Sync

on:
  pull_request:
    types: [opened, synchronize, closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  jira-sync:
    uses: dnode-ryosuke-yamazaki/study/.github/workflows/jira-sync-reusable.yml@main
    with:
      spec-only-path-pattern: "^(specs/|apps/[^/]+/specs/)"
    secrets:
      jira-base-url: ${{ secrets.JIRA_BASE_URL }}
      jira-email: ${{ secrets.JIRA_EMAIL }}
      jira-api-token: ${{ secrets.JIRA_API_TOKEN }}
