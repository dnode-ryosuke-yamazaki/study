# 設計(/devflow:design, ../skills/design/SKILL.md)の評価
description: 設計Skillの評価 — 承認済みの requirements.md から、必須5見出し+テスト戦略を満たす design.md と、TDD宣言・担当マーク付きの tasks.md を作成できることを検証

extensions:
  - file://./libs/extensions/stage-fixtures.mjs:extensionHook

providers:
  - id: anthropic:claude-agent-sdk
    label: from-approved-requirements
    config:
      apiKeyRequired: false
      working_dir: ./.tmp/design-from-approved
      setting_sources: ['user'] # ~/.claude/CLAUDE.md の全体ルールを読む(実運用と同じ条件)
      plugins:
        - type: local
          path: .. # devflow プラグインのルート(検証対象のSkillはここから読む)
      skills: ['devflow:design'] # 検証対象のSkillだけを許可する
      permission_mode: acceptEdits
      disallowed_tools: ['Write', 'Edit', 'NotebookEdit', 'Bash']
      effort: medium
      max_turns: 20
      append_system_prompt: |
        # 評価ハーネス実行時の特別指示

        このセッションは、design Skill の内容生成ロジックを機械的に検証するための、完全に
        自動化・非対話の評価ハーネス上で実行されています。人間のユーザーは存在せず、質問を
        出しても回答は得られません。Write/Edit/Bash は無効化されており、実ファイルの書き込みは
        起きません(意図的な仕様です)。

        この実行に限り、次のように読み替えてください:
        - 対象specのパスは、作業ディレクトリ直下の `specs/note-deletion/` とみなす。
          プロジェクトプロファイルの解決・他セッションとの重複確認は行わない。
        - agent-routing(Copilot委任)のクレジット残量確認は、キャッシュ・設定が無い場合の
          手順(全タスクをclaude担当にし、その事実を表示する)で進める。ユーザーへの
          `/usage` の貼り付け依頼はしない。
        - 「ユーザーに提案・確認する」「合意を得る」手順は実行不可能な操作として扱う。
          設計上の判断は requirements.md と作業ディレクトリ内の情報から導ける範囲で行い、
          その判断と理由を design.md に明記する。requirements.md に無い方針・ルールを
          新設してはならない。
        - 不明点に遭遇しても、質問で応答を終えることは絶対に行わない。
        - 作成する design.md と tasks.md は、それぞれファイルパスを明記した上で全文を
          この最終応答のテキストとしてそのまま出力する。要約や参照で済ませない。
        - 最終応答に出すのは、ファイルパスの行と2つのファイルの全文だけにする。
          前置き・補足・注記の類は書かない(判定は応答のテキスト全体を見るため、
          本文の外に書いた語も本文に書いたものとして扱われる)。
        - 書いたあとで数え違い・書き損じに気づいた場合は、注記で読み替えを求めず、
          出力する本文そのものを直した状態にしてから出す。

        これはこの評価セッションに限った特別指示で、通常運用の原則を否定するものではありません。

prompts:
  - |
    {{request}}

    (本検証では実際のファイル作成はできません。design.md と tasks.md の全文を、それぞれ
    ファイルパスを明記した上でこの1回の最終応答のテキストとしてそのまま出力してください。
    質問や確認では応答を終えず、この1回で書き切ってください。出すのはファイルパスの行と
    2つのファイルの全文だけで、前置き・補足・注記は書かないでください。)

defaultTest:
  options:
    provider:
      id: anthropic:claude-agent-sdk
      config:
        apiKeyRequired: false
        working_dir: .
        append_system_prompt: |
          # 採点時の注意
          あなたは、別のエージェントが生成した最終応答テキストを判定基準に照らして採点します。
          判定対象はWrite/Editが無効化されており、実ファイルは書き込まれていません。実ファイルの
          有無を不合格の根拠にせず、渡された最終応答のテキスト内容のみで判定してください。

tests:
  - description: 承認済みの requirements.md から、必須見出し・テスト戦略・担当マークを満たす design.md と tasks.md を作成できる
    providers: [from-approved-requirements]
    vars:
      workDir: .tmp/design-from-approved
      stage:
        - from: fixtures/design/requirements.md
          to: specs/note-deletion/requirements.md
      request: >-
        /devflow:design を実行してください。対象は ./specs/note-deletion/ です(requirements.md は
        ヒアリング済みで内容は確定。承認は3点セットがそろった後の仕様レビューで受ける)。対象プロジェクトは AWS Lambda(Python)+ API Gateway + DynamoDB で構成された
        ノートAPIで、ノートは `notes` テーブル(パーティションキー noteId、属性に ownerId・title・
        body・createdAt を持つ)に保存されています。呼び出し元の利用者IDは API Gateway の認可で
        検証済みのトークンから取得できます。
    assert:
      - description: design.md の必須5見出し・決定事項・テスト戦略が含まれている
        type: contains-all
        value:
          - '## 概要'
          - '## 決定事項'
          - '| 出所 |'
          - '## 品質統制の適用'
          - 'IMC-01'
          - 'IMC-06'
          - '<details><summary>詳細を開く</summary>'
          - '## 処理フロー'
          - '## エラーハンドリング'
          - '## 関連するファイル'
          - '## セキュリティ'
          - '## ログ'
          - '## テスト戦略'

      - description: 廃止した見出し(サマリ)を置いていない
        type: not-icontains
        value: '## サマリ'

      - description: ステータスを引用行で書いていない
        type: not-icontains
        value: '> ステータス:'

      - description: design.md と tasks.md の両方に、タイトルより前で draft / 0.1 の承認状態のフロントマターがある
        type: javascript
        value: |
          const blocks = [...output.matchAll(/^---\s*\n([\s\S]*?)\n---\s*\n\s*#\s+([^\n]*)/gm)];
          const ok = blocks.filter((m) =>
            /^status:\s*draft\s*$/m.test(m[1]) && /^version:\s*"0\.1"\s*$/m.test(m[1]) &&
            !/^approved_date:/m.test(m[1]));
          const titles = ok.map((m) => m[2]);
          const hasTasks = titles.some((t) => t.includes('タスク'));
          const hasDesign = titles.some((t) => !t.includes('タスク'));
          return hasTasks && hasDesign
            ? true
            : { pass: false, score: 0, reason: `draft / 0.1 のフロントマター付きの文書: ${JSON.stringify(titles)}` };

      - description: tasks.md にTDD宣言文があり、冒頭の件数行と全タスクの担当マークがある
        type: contains-all
        value:
          - 'TDDで進める'
          - '【担当: claude】'
          - 'タスク'

      - description: 残量の記録のためにCopilot CLIの残量表示の貼り付けを求めていない
        type: not-icontains
        value: '/usage'

      - description: 処理フローに実装識別子(関数名・変数名)が混ざっていない(design.md の「## 処理フロー」から次の見出しまでだけを見る。tasks.md とテスト戦略の備考には実装詳細を書いてよい)
        type: javascript
        value: |
          const section = output.match(/## 処理フロー[\s\S]*?(?=\n## |\n# |$)/);
          if (!section) return { pass: false, score: 0, reason: '「## 処理フロー」見出しが無い' };
          const words = ['def ', 'lambda_handler', 'boto3', 'return {'];
          const hit = words.filter((w) => section[0].toLowerCase().includes(w.toLowerCase()));
          return hit.length === 0 ? true : { pass: false, score: 0, reason: `処理フローに実装識別子: ${hit.join(', ')}` };

      - description: 要件の全 [n] がテスト戦略に割り当てられ、処理フローが業務的な言葉で書かれているか
        type: llm-rubric
        value: >-
          出力された design.md / tasks.md が次を満たすこと。
          (1) テスト戦略の表に、requirements.md の `[n]` 採番された全項目
          (ノート削除API-1・2、削除できる対象-1〜4、非機能要件-1)がそれぞれ1行ずつ
          載っている(行が欠けていれば不合格)。テスト種別は test-policy.md の
          種別名(単体 / 性質 / 契約 / 構造検証 / 環境スモーク / 性能 / evals)で書かれ、
          「手動」「手動確認」は種別として使われていない。数値の約束が無い項目のように
          テストを置かない項目は「なし」と備考の理由で構わないが、その場合は
          テスト戦略の要点行が「全項目に割り当て済み・漏れなし」と食い違っていないこと。
          (2) 処理フローの手順が日本語の文章で書かれ、「〜の場合は…、そうでない場合は…」の
          形で分岐(存在しない・他人のノート・自分のノート)が網羅されている。
          (3) エラーハンドリング・セキュリティ・ログの各見出しが、この機能固有の内容
          (存在の有無を推測させない404の統一、所有者確認、削除の成功/失敗ログなど)を
          検討しており、「特になし」で済ませていない。
          (4) requirements.md に無い方針(論理削除、監査テーブルの新設、一括削除など)を
          新設していない。
          (4-2) 設定ファイル・キャッシュ・コマンド・ログの書式のような、人が読まない
          書式を design.md 本文に置いていない。そうした書式がある場合は appendix.md に
          分けて design.md にリンクを1行残しており、無い場合は appendix.md を作っていない
          (この機能に付録相当の内容が無いと判断したのであれば、appendix.md が無くてよい)。
          (5) tasks.md の各タスクが Red → Green → Refactor で完結できる粒度に分かれ、
          全タスクに担当マークが付いている。冒頭の件数行の総件数が、実際に並んでいる
          タスク(`###` 見出し)の数と一致している。
          (6) tasks.md のタスク名が、折りたたみを開かなくても何をするか分かる言い方に
          なっており(ファイル名・部品名だけの見出しになっていない)、各タスクに
          何のための作業かを示す1行が付いている。
          (7) design.md の要点行・決定事項の表が、その行だけを読んで意味が取れる。
          (8) 要点行・図の説明・タスク名で主語と対象が省かれていない。どのファイル・
          何が動くのかが読み取れる。
          (9) design.md の「品質統制の適用」の表に IMC-01〜06 の6行がそろい、各行の判定が
          「適用」か「対象外」のどちらかで理由が書かれている。この機能はノートを削除し
          (状態を変える)、外部からのリクエストを受けるため、IMC-02 冪等性・IMC-03 監査ログ・
          IMC-06 OWASP は「適用」になっている(対象外なら不合格)。IMC-03 を適用にしたことを
          理由に、監査用テーブルのような requirements.md に無い仕組みを新設していない
          (ログ見出しの記述で満たしている)。
          いずれかを満たさない場合は不合格とし、理由を具体的に述べること。
