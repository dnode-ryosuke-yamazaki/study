# 要件定義(/devflow:requirement, ../skills/requirement/SKILL.md)の評価
description: 要件定義Skillの評価 — ヒアリング済みの内容から、自分の書式(固定セットの見出し・要点と畳み・出所の目印・[n]採番・ステータス行)を満たす requirements.md を新規作成できることを検証

extensions:
  - file://./libs/extensions/stage-fixtures.mjs:extensionHook

providers:
  - id: anthropic:claude-agent-sdk
    label: new-spec
    config:
      apiKeyRequired: false
      # extensionHook(beforeEach)が空のgitリポジトリとして作る使い捨てディレクトリ
      working_dir: ./.tmp/requirement-new-spec
      setting_sources: ['user'] # ~/.claude/CLAUDE.md の全体ルールを読む(実運用と同じ条件)
      plugins:
        - type: local
          path: .. # devflow プラグインのルート(検証対象のSkillはここから読む)
      skills: ['devflow:requirement'] # 検証対象のSkillだけを許可する
      permission_mode: acceptEdits
      disallowed_tools: ['Write', 'Edit', 'NotebookEdit', 'Bash']
      effort: medium
      max_turns: 20
      # 「憶測で補完しない」「JIRAチケットを確認する」といったSkill側の原則は、ユーザーターン
      # への追記より権威が高く正当に無視される。システムプロンプトへの追記として与え、
      # この評価実行に限った特別指示として扱わせる(社内標準テンプレートの evals と同じ手口)。
      append_system_prompt: &no_ask_system_prompt |
        # 評価ハーネス実行時の特別指示

        このセッションは、requirement Skill の内容生成ロジックを機械的に検証するための、
        完全に自動化・非対話の評価ハーネス上で実行されています。人間のユーザーは存在せず、
        質問を出しても誰にも届かず、回答は得られません。Write/Edit/Bash は無効化されており、
        実ファイルの書き込みは起きません(意図的な仕様です)。

        この実行に限り、次のように読み替えてください:
        - JIRAチケットの確認、他セッション・worktreeとの重複確認、プロジェクトプロファイルの
          解決は行わない(この評価では対象外)。対象specのパスは、作業ディレクトリ直下の
          `specs/<機能名>/` とみなす。
        - 「ユーザーに質問する」「AskUserQuestion を使う」「合意を得る」手順は実行不可能な
          操作として扱う。ヒアリングの5項目は、依頼文に書かれている内容で埋まっているものと
          みなす。画面案3パターンの提示と画面モックの作成・発行も省略する(画面を持たない機能では
          不要、画面を持つ機能では依頼文に書かれた段階まで済んでいるものとみなす)。
        - 不明点に遭遇しても、質問で応答を終えることは絶対に行わない。依頼文から根拠を辿れる
          範囲で書き、それでも決められない点だけを本文中に「未確定」と明記する。依頼文に無い
          方針・数値・ルールを新設してはならない(会話ドリブン原則はこの評価でも有効)。
        - 作成する requirements.md は、ファイルパスを明記した上で全文をこの最終応答の
          テキストとしてそのまま出力する。要約や参照で済ませない。

        これはこの評価セッションに限った特別指示で、通常運用での「憶測で補完しない」原則を
        否定するものではありません。

prompts:
  - |
    {{request}}

    (本検証では実際のファイル作成はできません。requirements.md の全文を、ファイルパスを
    明記した上でこの1回の最終応答のテキストとしてそのまま出力してください。質問や確認では
    応答を終えず、この1回で書き切ってください。)

defaultTest:
  options:
    provider:
      id: anthropic:claude-agent-sdk
      config:
        apiKeyRequired: false
        working_dir: .
        append_system_prompt: |
          # 採点時の注意
          あなたは、別のエージェントが生成した最終応答テキストを判定基準に照らして採点します。
          判定対象はWrite/Editが無効化されており、実ファイルは書き込まれていません。実ファイルの
          有無を不合格の根拠にせず、渡された最終応答のテキスト内容のみで判定してください。

tests:
  - description: ヒアリング済みの内容から、自分の書式を満たす requirements.md を新規作成できる
    providers: [new-spec]
    vars:
      workDir: .tmp/requirement-new-spec
      request: >-
        /devflow:requirement を実行してください。対象は新しい機能「ノートの削除API」です。
        ヒアリングは済んでおり、確認できた内容は次のとおりです。この内容だけで書いてください。
        - 誰・何のため: ノートアプリ(notes-api)の利用者が、自分で作成したノートを削除するための
          API。呼び出し元はフロントエンドのノート一覧画面。
        - 何ができればよいか: DELETE /notes/{noteId} を呼ぶと対象ノートが削除される。成功時は
          204(本文なし)。
        - ビジネスルールと根拠: 削除できるのは自分が作成したノートだけ(他人のノートは削除
          できない。根拠: 既存の閲覧APIと同じ所有者制限に揃えるという2026-08のチーム決定)。
          対象ノートが存在しない場合、および他人のノートを指定した場合はどちらも404を返す
          (存在の有無を推測させないため。根拠: セキュリティ設計方針)。削除は物理削除でよい
          (復元機能は作らない)。
        - 今回やらないこと: 複数ノートの一括削除、削除の取り消し(ゴミ箱)、管理者による他人の
          ノート削除。
        - データ量・利用頻度: 1ユーザーあたり最大数百件のノート。削除は1日に数十回程度。
          特別な性能要件はなし。
    assert:
      - description: 固定セットの必須5見出しとステータス行・畳みのタグが含まれている
        type: contains-all
        value:
          - '## 概要'
          - '## ユーザーストーリー'
          - '## ユースケース図'
          - '## 機能要件'
          - '## ビジネスルール'
          - '## スコープ外'
          - 'ステータス'
          - '優先度'
          - '<details><summary>詳細を開く</summary>'
          - '```mermaid'

      - description: 廃止した見出し(サマリ)を置いていない
        type: not-icontains
        value: '## サマリ'

      - description: ステータスと優先度を引用行で書いていない
        type: not-icontains
        value: '> ステータス:'

      - description: 出所の目印が〔合意〕〔提案〕の両方の形で現れている
        type: contains-all
        value:
          - '〔合意〕'
          - '〔提案〕'

      - description: テスト対応用の [n] 採番が振られている
        type: regex
        value: '\[1\][\s\S]*\[2\]'

      - description: 実装方法(HOW)や差分ナラティブが混ざっていない
        type: not-icontains-any
        value: ['def ', 'function ', 'SELECT ', '旧仕様', 'から変更した']

      - description: 会話で確認した内容だけが、根拠つき・テスト可能な文体で書かれているか
        type: llm-rubric
        value: >-
          出力された requirements.md が次を満たすこと。
          (1) 依頼文の内容(自分のノートのみ削除可・存在しない/他人のノートは404・物理削除・
          204応答・スコープ外3点)が漏れなく反映されている。
          (2) ビジネスルールの数値・条件に、依頼文にある根拠(チーム決定・セキュリティ設計方針)が
          添えられている。
          (3) `[n]` を振った箇条書きが「〜の場合、〜になること」のようにテストに転記できる
          文体になっている。
          (4) 依頼文に無い方針・数値・ルール(例: 論理削除、監査ログ、レート制限、一括削除の
          将来対応)を新設していない。依頼文に無い細部を「未確定」と明記するのは合理的な補記
          として許容する。
          (5) スコープ外(今回やらないこと)が明記されている。
          (6) 数式・変数名・実装方法(HOW)がビジネスルールに混ざっていない。
          (7) 折りたたみの外に見えている行(「概要」・要点行・人が読む見出しの箇条書き)が、
          その行だけを読んで意味が取れる。定型の圧縮や、意味を添えない略語が残っていない。
          (8) このspecで新しく作るもの(表・設定・生成物)があれば、名前の初出で
          「誰が何のために使うか」「何が入っているか」が読み取れる。名前を出すだけで
          目的が書かれていないものが無い。
          (9) 要点行・図の説明で、主語(何が・誰が)と対象(何を・どのファイルを)が
          省かれていない。「読むだけで書かない」のように何の話か分からない行が無い。
          (10) 用語の説明だけを並べた節(用語集・前提知識)を文書の前段に置いていない。
          いずれかを満たさない場合は不合格とし、理由を具体的に述べること。

  - description: 画面モックで合意した機能では、UI/UX要件に要点とモックへの参照だけを書き、モックで見つけた抜けを〔提案〕で戻す
    providers: [new-spec]
    vars:
      workDir: .tmp/requirement-new-spec
      request: >-
        /devflow:requirement を実行してください。対象は新しい機能「メモの読み上げ画面」です。
        ヒアリングと画面イメージのすり合わせは済んでおり、確認できた内容は次のとおりです。
        この内容だけで書いてください。
        - 誰・何のため: 自分のMacで作業する運用者が、貼った文章を音声で聞くための画面。
        - 何ができればよいか: 文章を貼って「音声にする」を押すと再生できる。速度を5段階で
          切り替えられる。作った音声は一覧に新しい順で並ぶ。
        - ビジネスルールと根拠: 文章が空のときは音声にしない(空の音声ができるのを防ぐため。
          根拠: 2026-09の運用者との合意)。
        - 今回やらないこと: スマホからの操作、一覧からの削除。
        - データ量・利用頻度: 1日に数件。
        - 画面イメージ: ASCIIの3案から「縦1列で、上から文章を貼る欄・再生操作・一覧」の案が
          選ばれた。その案を specs/<機能名>/mock.html の画面モックにし、Artifact
          (https://claude.ai/artifact/EXAMPLE)で触ってもらって合意した。
        - モックを作る途中で、音声づくりに失敗したときの表示が要ると分かり、モックには
          「失敗した旨とやり直しの案内を出す」を入れた。この点はユーザーにまだ確認していない。
    assert:
      - description: UI/UX要件の見出しがあり、モックのファイルとURLを参照している
        type: contains-all
        value:
          - '## UI/UX要件'
          - 'mock.html'
          - 'https://claude.ai/artifact/EXAMPLE'

      - description: UI/UX要件に要点と参照だけを書き、モックで見つけた抜けを〔提案〕で戻しているか
        type: llm-rubric
        value: >-
          出力された requirements.md が次を満たすこと。
          (1) 「UI/UX要件」に、合意した画面の要点(縦1列で上から文章を貼る欄・再生操作・一覧の順)と、
          mock.html への参照・ArtifactのURLが書かれている。
          (2) 「UI/UX要件」にASCIIのワイヤーフレームやモックの細部(色・寸法・ボタンの並びの細部)を
          書き写していない。
          (3) 音声づくりに失敗したときの表示(失敗した旨とやり直しの案内)が requirements.md の
          要件として書かれており、その行(または、その要件が畳みの中の [n] 項目にある場合はその
          見出しの要点行)に〔提案〕が付いている。〔合意〕にしていない。
          (4) 依頼文に無い方針・数値・ルールを新設していない。
          いずれかを満たさない場合は不合格とし、理由を具体的に述べること。

  - description: 数値ルールが6件ある依頼では、specの分割を提案する
    providers: [new-spec]
    vars:
      workDir: .tmp/requirement-new-spec
      request: >-
        /devflow:requirement を実行してください。対象は新しい機能「バッチの実行条件チェック」です。
        ヒアリングは済んでおり、確認できた内容は次のとおりです。この内容だけで書いてください。
        - 誰・何のため: 夜間バッチの運用者が、実行前に前提条件を機械で確かめられるようにする。
        - 何ができればよいか: 条件を1つずつ判定し、満たさないものを一覧で返す。
        - ビジネスルールと根拠(いずれも2026-09の運用会議での決定):
          (1) 空きディスクは10GB以上あること。
          (2) 直近の実行から6時間以上空いていること。
          (3) 未処理の入力ファイルが500件以下であること。
          (4) 同時に走るジョブは3本までであること。
          (5) 1回の実行は90分以内に終わること。
          (6) 連続失敗が2回に達したら実行しないこと。
        - 今回やらないこと: 条件を満たさなかったときの自動復旧、条件のGUI編集。
        - データ量・利用頻度: 1日1回の実行。
    assert:
      - description: 数値ルールが5件を超えるため、specの分割を提案している
        type: icontains
        value: '分割'

      - description: 分割の提案が、数値ルールの件数を理由にしているか
        type: llm-rubric
        value: >-
          応答が、このspecのビジネスルールに数値・閾値を持つルールが6件あることを踏まえて、
          specの分割を提案していること(分割するかどうかの決定をユーザーに委ねる形でよい)。
          件数に触れずに分割を提案している、または分割の提案が一切無い場合は不合格とし、
          理由を具体的に述べること。
